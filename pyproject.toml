[project]
name = "aloud"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.5",
    "google-adk>=2.14.0",
    "google-cloud-firestore>=2.34.1",
    "google-genai>=2.34.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
demo = [
    "pillow>=13.0.0",
    "playwright>=1.65.1",
]
dev = ["pytest>=9.2.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
